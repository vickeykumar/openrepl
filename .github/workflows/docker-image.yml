# The Docker image: built on every pull request to master (as before), then started
# and checked from the outside: a smoke test (scripts/ci/smoke.sh) and the browser
# tests (e2e/, Playwright). Both must pass. What the browser tests found is in the
# job and in the "playwright-report" artifact of the run (the "browser" job, which runs after "build").
#
# Two ways to wait less for a fix of a test:
#  - A push that changes only tests or docs (e2e/, docs/, *.md) skips the "build" job: the image is the same, and the
#    "browser" job rebuilds it from the layer cache the last run left. "changes" decides it from what the push itself changed
#    (not from the whole pull request).
#  - "Run workflow" (workflow_dispatch) takes "tests_grep": only the browser tests whose title matches it run, so a flaky test
#    is tried again alone, with the code of the branch, in the time of the image rebuild.
name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      tests_grep:
        description: "Run only the browser tests whose title matches this (a regular expression, for example: editor-tabs). Empty: all of them, and the image checks."
        required: false
        default: ""
        type: string

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # Does this push change the image? Not when it changes only tests or docs, or when a run is asked for a few tests only.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.what.outputs.image }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: What did this push change
      id: what
      env:
        EVENT: ${{ github.event_name }}
        BEFORE: ${{ github.event.before }}
        AFTER: ${{ github.sha }}
        GREP: ${{ github.event.inputs.tests_grep }}
      run: |
        image=true
        if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$GREP" ]; then
          image=false
          echo "a run for some tests only: the image checks are skipped"
        elif [ "$EVENT" = "pull_request" ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
          # what the push added to the branch: the files it changed
          files=$(git diff --name-only "$BEFORE" "$AFTER")
          echo "changed by this push:"; echo "$files"
          others=$(echo "$files" | grep -vE '^(e2e/|docs/|[^/]+\.md$)' || true)
          if [ -n "$files" ] && [ -z "$others" ]; then
            image=false
            echo "only tests or docs: the image checks are skipped"
          fi
        fi
        echo "image=$image" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    # Which Landlock the runner's kernel has (LLD 14): 4 is files and TCP, 5 adds device ioctls, 6 (kernel 6.12)
    # adds the signal and abstract-socket scopes. It only prints; the compatibility step below skips itself
    # when there is none.
    - name: Landlock on this runner
      run: |
        uname -rm
        python3 -c "import ctypes;c=ctypes.CDLL(None,use_errno=True);r=c.syscall(444,None,0,1);print('Landlock ABI:',r if r>=0 else 'none (errno %d)'%ctypes.get_errno())"
    # The toolchain layer (install_prerequisite.sh: nvm, Rust, Cling) is the same on every run and
    # takes minutes to build, so its layers are kept in the GitHub Actions cache, one scope per
    # architecture. The scope names are those of the Docker Push CI, which fills the cache from
    # master: a pull request reads that cache too.
    - name: Build the Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        platforms: linux/${{ matrix.arch }}
        load: true
        tags: openrepl:${{ matrix.arch }}
        cache-from: type=gha,scope=linux-${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=linux-${{ matrix.arch }}
    - name: Describe the Docker image
      run: |
        docker history openrepl:${{ matrix.arch }}
        docker inspect openrepl:${{ matrix.arch }}
    - name: docker-image-size-limit
      uses: wemake-services/docker-image-size-limit@master
      with:  # lint this image by itself
        image: 'openrepl:${{ matrix.arch }}'
        # The arm64 image is larger: it carries the conda-forge Cling (about 1.6 GB pruned)
        # and the Rust toolchain that builds evcxr. Keep the amd64 budget at 3 GB.
        size: ${{ matrix.arch == 'arm64' && '6GB' || '3GB' }}
        max_layers: 15
        show_current_size: true
        exit_zero: true

    - name: Start the image
      run: |
        docker run -d --name openrepl --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw --privileged \
          -p 8080:8080 openrepl:${{ matrix.arch }} -p 8080
    - name: Smoke test
      run: bash scripts/ci/smoke.sh http://localhost:8080
    # the programs the REPLs start must be found with the plain system PATH, as the server finds them
    # (a cleanup once removed node, and the Node.js and TypeScript REPLs failed in the deployed image)
    - name: The REPL programs are on the PATH
      run: |
        docker exec openrepl env PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin bash -c '
          for c in "node --version" "npm --version" "tsc --version" "ts-node --version" "python3 --version" "go version" "java --version" "irb --version" "jshell --version" "cling --version"; do
            echo "== $c"; bash -c "$c" || { echo "FAILED: $c"; exit 1; }
          done'
    # every REPL and every Run under the filesystem sandbox (LLD 14), each without it and with it: what works
    # without must work with it. The script skips itself when the runner's kernel has no Landlock.
    - name: Every REPL and Run under the filesystem sandbox
      run: |
        docker exec openrepl bash -c 'grep -a "filesystem sandbox" /gottyTraces/gotty.log || true'
        docker cp scripts/ci/landlock-compat.py openrepl:/tmp/landlock-compat.py
        docker cp src/resources/meta/demos.xml openrepl:/tmp/demos.xml
        docker exec openrepl python3 /tmp/landlock-compat.py --demos /tmp/demos.xml

    # why the ts-node REPL stops ("Cannot read property 'fileExists' of undefined"): which compiler it
    # loads and whether that one has `sys`. Only prints, it does not fail the build.
    - name: Look at ts-node
      continue-on-error: true
      run: |
        docker exec openrepl env PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin bash -c '
          for d in / /tmp /tmp/home; do
            echo "== cwd $d"; cd "$d" 2>/dev/null || continue
            node -e "var t=require(\"typescript\"); console.log(require.resolve(\"typescript\"), t.version, typeof t.sys)" 2>&1 | head -5
            echo "40 + 2" | timeout 20 ts-node 2>&1 | head -15
          done
          G=/root/.nvm/versions/node/v12.22.9/lib/node_modules
          ls -la $G $G/typescript $G/ts-node/node_modules 2>&1 | head -40
          node -e "var t=require(\"$G/typescript\"); console.log(\"global typescript\", t.version, typeof t.sys, Object.keys(t).length)" 2>&1 | head -8
          node -p "require(\"$G/typescript/package.json\").version + \" main=\" + require(\"$G/typescript/package.json\").main"
          tsc --version; echo "const a: number = 40 + 2; console.log(a)" > /tmp/a.ts; ts-node /tmp/a.ts 2>&1 | head -4; cd /tmp && tsc a.ts && node a.js'

    # gotty is PID 1 in the image, so a process that loses its parent is handed to it and, when it
    # ends, stays <defunct> unless gotty reaps it (src/reaper): the parent of this one goes at once
    - name: Orphans that end are reaped
      run: |
        docker exec openrepl bash -c '(sh -c "sleep 1 & exit 0"); sleep 10; z=$(ps -eo pid,ppid,stat,comm | awk "\$3 ~ /^Z/ && \$2 == 1"); if [ -n "$z" ]; then echo "defunct processes left under PID 1:"; echo "$z"; exit 1; fi; echo "no defunct process under PID 1"'


  # The browser tests are their own job (they need the image of the job above, which is rebuilt here from the layer cache that
  # job has just filled, in a minute or two): a flaky browser test can then be run again alone ("Re-run failed jobs"),
  # without building the image and running the checks above once more.
  # Every app of the App Store's safe list is installed for real (micromamba, conda-forge) INSIDE the image that was just built, and used
  # under the filesystem sandbox, and a worker's replay is run: independent of the browser tests, which cannot do that (they have no
  # internet and no signed-in user). It starts when the build is done, like the browser tests, and is a job of its own.
  appstore:
    name: App Store installs
    needs: [changes, build]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      GO111MODULE: "off"
      GOPATH: ${{ github.workspace }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: "1.23.12"
        cache: false
    - uses: docker/setup-buildx-action@v3
    - name: Build the Docker image (from the cache of the job above)
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        platforms: linux/${{ matrix.arch }}
        load: true
        tags: openrepl:${{ matrix.arch }}
        cache-from: type=gha,scope=linux-${{ matrix.arch }}
    # a static program (no cgo), so that it runs in the image whatever the runner's libc is
    - name: The test program
      working-directory: src
      env:
        CGO_ENABLED: "0"
      run: go test -tags realinstall -c -o "$RUNNER_TEMP/appstore.test" appstore
    - name: Install every app of the safe list, use it under the sandbox, replay it on a worker
      run: |
        docker run --rm --entrypoint /appstore.test \
          -v "$RUNNER_TEMP/appstore.test:/appstore.test:ro" -e OPENREPL_REAL_STORE=/store \
          openrepl:${{ matrix.arch }} \
          -test.v -test.timeout=80m -test.run='TestEveryAppOfTheSafeList|TestTheSandboxLets|TestAWorkerTakes'

  browser:
    needs: [changes, build]
    # the build job may have been skipped on purpose (see "changes"); a failed or cancelled one stops this one
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - name: Build the Docker image (from the cache of the job above)
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        platforms: linux/${{ matrix.arch }}
        load: true
        tags: openrepl:${{ matrix.arch }}
        cache-from: type=gha,scope=linux-${{ matrix.arch }}
    - name: Start the image
      # The page talks to a Realtime Database for the terminal and editor sync of shared sessions. The browser tests give it an
      # emulator on this runner (below), not the real project: no network and no other tests in the way, so the tests of shared
      # sessions are fast and do not depend on how far the runner is from the real service.
      env:
        FIREBASE_CONFIG_CI: '{"apiKey":"AIzaSyDemoKeyForTheCiEmulatorOnly0000000","authDomain":"demo-openrepl.firebaseapp.com","projectId":"demo-openrepl","databaseURL":"http://127.0.0.1:9000?ns=demo-openrepl"}'
      run: |
        docker run -d --name openrepl --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw --privileged \
          -e OPENREPL_FIREBASE_CONFIG="$FIREBASE_CONFIG_CI" \
          -p 8080:8080 openrepl:${{ matrix.arch }} -p 8080
        for i in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:8080/ && exit 0; sleep 2; done
        echo "the server did not answer in 2 minutes"; docker logs openrepl 2>&1 | tail -n 50; exit 1
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"
    - name: Start the Firebase Realtime Database emulator
      run: |
        npm install -g firebase-tools
        echo '{"rules":{".read":true,".write":true}}' > "$RUNNER_TEMP/database.rules.json"
        printf '{"database":{"rules":"%s"},"emulators":{"database":{"host":"127.0.0.1","port":9000}}}' "$RUNNER_TEMP/database.rules.json" > "$RUNNER_TEMP/firebase.json"
        nohup firebase emulators:start --only database --project demo-openrepl --config "$RUNNER_TEMP/firebase.json" > "$RUNNER_TEMP/emulator.log" 2>&1 &
        for i in $(seq 1 60); do curl -fsS -o /dev/null "http://127.0.0.1:9000/.json?ns=demo-openrepl" && echo "the emulator answers" && exit 0; sleep 2; done
        echo "the emulator did not answer in 2 minutes"; tail -n 40 "$RUNNER_TEMP/emulator.log"; exit 1
    - name: Browser tests (Playwright)
      id: e2e
      working-directory: e2e
      env:
        BASE_URL: http://localhost:8080
        CI: "true"
        TESTS_GREP: ${{ github.event.inputs.tests_grep }}
      run: |
        npm install --no-audit --no-fund
        # The runner's apt mirror (azure.archive.ubuntu.com) sometimes does not resolve, and then the system
        # packages of the browser cannot be downloaded. Use the standard archive in that case, and try again
        # a few times before giving up.
        if ! getent hosts azure.archive.ubuntu.com > /dev/null; then
          echo "azure.archive.ubuntu.com does not resolve: using archive.ubuntu.com"
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
        fi
        for attempt in 1 2 3; do
          npx playwright install --with-deps chromium && break
          if [ "$attempt" = 3 ]; then exit 1; fi
          echo "browser install failed (attempt $attempt), trying again in 20 s"; sleep 20
        done
        args=()
        if [ -n "$TESTS_GREP" ]; then args+=(-g "$TESTS_GREP"); echo "only the tests that match: $TESTS_GREP"; fi
        npx playwright test "${args[@]}"
    - name: Measure the rappel REPL test (20 runs, no retries)
      # A measurement, to tell a test that fails now and then from one that fails often: the Assembly (rappel) REPL
      # test failed on amd64 in most runs of 2026-11-11 and 12. Its result does not fail the job; it is written to the
      # job summary. Remove this step when the question is answered.
      if: always() && steps.e2e.outcome != 'skipped' && github.event.inputs.tests_grep == ''
      continue-on-error: true
      working-directory: e2e
      env:
        BASE_URL: http://localhost:8080
        CI: "true"
      run: |
        npx playwright test tests/repl.spec.js -g "Assembly \(rappel\)" --repeat-each=20 --retries=0 --reporter=line > /tmp/rappel-x20.txt 2>&1 || true
        passed=$(grep -Eo '[0-9]+ passed' /tmp/rappel-x20.txt | tail -1)
        failed=$(grep -Eo '[0-9]+ failed' /tmp/rappel-x20.txt | tail -1)
        echo "### rappel REPL test x20 on $(uname -m): ${passed:-0 passed}, ${failed:-0 failed}" | tee -a "$GITHUB_STEP_SUMMARY"
        # what the terminal showed in the first failure
        grep -m1 "The terminal showed" /tmp/rappel-x20.txt | cut -c1-600 | tee -a "$GITHUB_STEP_SUMMARY" || true
    - name: Browser tests report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          e2e/playwright-report
          e2e/test-results
        if-no-files-found: ignore
        retention-days: 14
    - name: What the browser tests found
      if: always()
      run: |
        echo "browser tests: ${{ steps.e2e.outcome }}"
        if [ "${{ steps.e2e.outcome }}" = "failure" ]; then echo "::error title=Browser tests::They failed. Open the playwright-report artifact of this run."; fi
    - name: Firebase emulator log
      if: always()
      run: tail -n 60 "$RUNNER_TEMP/emulator.log" 2>/dev/null || true
    - name: Server log
      if: always()
      run: docker logs openrepl 2>&1 | tail -n 200 || true
