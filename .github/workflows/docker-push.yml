name: Docker Push CI

on:
  push:
    branches:
      - master

env:
  IMAGE_NAME: ${{ vars.DOCKER_REGISTRY }}/openrepl

jobs:
  # Each architecture is built on a runner of its own kind, in parallel: building
  # arm64 under QEMU on an amd64 runner takes hours. Each job pushes its image by
  # digest only; the merge job below then puts both under the tags.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Name the platform for files and cache scopes
      run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
      env:
        PLATFORM: ${{ matrix.platform }}

    - name: Login to Docker registry
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - uses: docker/setup-buildx-action@v3

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: ${{ matrix.platform }}
        outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
        cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
        cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

    - name: Export the digest
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"

    - name: Upload the digest
      uses: actions/upload-artifact@v4
      with:
        name: digests-${{ env.PLATFORM_PAIR }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Download the digests
      uses: actions/download-artifact@v4
      with:
        path: /tmp/digests
        pattern: digests-*
        merge-multiple: true

    - uses: benjlevesque/short-sha@v2.1
      id: short-sha
      with:
        length: 7

    - name: Login to Docker registry
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - uses: docker/setup-buildx-action@v3

    - name: Create the multi-arch tags
      working-directory: /tmp/digests
      run: |
        docker buildx imagetools create \
          -t "${IMAGE_NAME}:${SHA}" -t "${IMAGE_NAME}:latest" \
          $(printf "${IMAGE_NAME}@sha256:%s " *)

    - name: Show the result
      run: docker buildx imagetools inspect "${IMAGE_NAME}:latest"
