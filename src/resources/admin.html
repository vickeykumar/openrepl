<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>OpenREPL Admin</title>
    <link rel="icon" href="./images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/admin.css">
    <script src="./js/theme.js"></script>
  </head>
  <body>
    <header class="top">
      <a class="brand" href="./" aria-label="OpenREPL home">Open<b>REPL</b></a>
      <span class="tag">Admin</span>
      <span class="grow"></span>
      <span class="live" id="live" role="status">
        <span class="dot" id="live-dot" data-state="live"></span>
        <span class="when" id="live-text">Loading…</span>
      </span>
      <button type="button" class="icon-btn" id="pause" aria-label="Pause automatic refresh" title="Pause automatic refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </button>
      <button type="button" class="icon-btn theme-toggle" data-theme-toggle aria-label="Switch theme">
        <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>

    <div class="shell">
      <nav id="nav" aria-label="Admin sections"></nav>
      <main id="view" tabindex="-1"><p class="loading">Loading…</p></main>
    </div>

    <dialog id="dialog"></dialog>
    <div id="toasts" role="status" aria-live="polite"></div>

    <noscript><p class="loading">The admin dashboard needs JavaScript.</p></noscript>
    <script src="./js/admin.js"></script>
  </body>
</html>
