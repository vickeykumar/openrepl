<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Blog editor · OpenREPL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/scribbler-global.css">
    <link rel="stylesheet" href="./css/scribbler-doc.css">
    <link rel="stylesheet" href="./css/editblog.css">
    <script src="./config.js"></script>
    <script src="./js/theme.js"></script>
    <script src="./settings.js"></script>
    <script src="./js/preprocessing.js"></script>
    <script src="./js/notices.js"></script>
    <!-- TinyMCE, the free (GPL) build: no account, no API key, and none of the paid plugins -->
    <script src="https://cdn.jsdelivr.net/npm/tinymce@7/tinymce.min.js" referrerpolicy="origin"></script>
    <link rel="author" href="humans.txt">
  </head>
  <body>
    <nav class="header">
      <h1 class="logo"><span class="go__color"><br>Open</span>REPL</h1>
      <ul class="menu">
        <li class="menu__item toggle"><button type="button" class="toggle__button" aria-label="Menu" aria-expanded="false"><span></span></button></li>
        <li class="menu__item menu__item--theme"><button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch to dark theme"><svg class="theme-toggle__moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg><svg class="theme-toggle__sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2 M12 20v2 M4.9 4.9l1.4 1.4 M17.7 17.7l1.4 1.4 M2 12h2 M20 12h2 M4.9 19.1l1.4-1.4 M17.7 6.3l1.4-1.4"></path></svg></button></li>
        <li class="menu__item"><a href="/blog" class="link link--dark"><i class="fa fa-newspaper-o"></i> View blog</a></li>
        <li class="menu__item"><a id="sign-in-button" class="link link--dark" href="/" data-logout><i id="auth-icon" class="fa fa-sign-out"></i> Logout</a></li>
        <li class="menu__item"><a href="/" class="link link--dark"><i class="fa fa-home"></i> Home</a></li>
      </ul>
    </nav>

    <main class="eb">
      <header class="eb-bar">
        <h1>Blog editor</h1>
        <span id="eb-state" class="eb-pill" data-state="saved" hidden></span>
        <span class="eb-spacer"></span>
        <button type="button" id="eb-preview" class="eb-btn"><i class="fa fa-eye" aria-hidden="true"></i> Preview</button>
        <button type="button" id="eb-delete" class="eb-btn eb-btn--danger" disabled><i class="fa fa-trash-o" aria-hidden="true"></i> Delete</button>
        <button type="button" id="eb-save" class="eb-btn eb-btn--primary">Save</button>
      </header>

      <div class="eb-layout">
        <aside class="eb-side" aria-label="Posts">
          <input type="search" id="eb-search" placeholder="Search posts" aria-label="Search posts">
          <button type="button" id="eb-new" class="eb-btn"><i class="fa fa-plus" aria-hidden="true"></i> New post</button>
          <ul id="eb-list"></ul>
        </aside>

        <section class="eb-main">
          <div id="eb-draft" class="eb-draft" hidden>
            <span id="eb-draft-text"></span>
            <button type="button" class="eb-btn" id="eb-draft-restore">Restore it</button>
            <button type="button" class="eb-btn" id="eb-draft-discard">Discard it</button>
          </div>
          <form id="editor-form" autocomplete="off" novalidate>
            <div class="eb-main">
              <label class="eb-field eb-field--title">Title
                <input type="text" id="blogtitle" name="title" maxlength="200" placeholder="A title that says what the post is about">
              </label>
              <div class="eb-row">
                <label class="eb-field">Address
                  <input type="text" id="blogname" name="name" maxlength="200" placeholder="debugging-with-genie">
                  <span class="eb-hint" id="eb-name-hint"><span>Shown as <code>/blog?name=&hellip;</code></span></span>
                </label>
                <label class="eb-field">Short description
                  <input type="text" id="blogdesc" name="desc" maxlength="500" placeholder="One or two sentences for the list of posts">
                  <span class="eb-hint"><span>Shown under the title in the list</span><span id="eb-count">0 / 500</span></span>
                </label>
              </div>
              <textarea id="blog-editor" name="content"></textarea>
            </div>
          </form>
        </section>
      </div>
    </main>

    <dialog id="eb-dialog" class="eb-dialog" aria-labelledby="eb-dialog-title">
      <h2 id="eb-dialog-title"></h2>
      <p id="eb-dialog-body"></p>
      <div class="eb-dialog__buttons">
        <button type="button" class="eb-btn" id="eb-dialog-cancel">Cancel</button>
        <button type="button" class="eb-btn eb-btn--primary" id="eb-dialog-ok">OK</button>
      </div>
    </dialog>
    <dialog id="eb-preview-dialog" class="eb-dialog eb-preview" aria-label="Preview of the post">
      <header><strong>Preview</strong><button type="button" class="eb-btn" id="eb-preview-close">Close</button></header>
      <iframe id="eb-preview-frame" title="Preview of the post"></iframe>
    </dialog>

    <footer class="footer">
      <a href="./about.html" class="link link--light">About</a> <span class="dot"></span>
      <span id="copyright_year"></span>&copy;<span class="go__color">Open</span>REPL
    </footer>
    <script>window.MODEL_CHOICE_KEY = "genie-blog-model";</script>
    <script src="./js/model-choice.js"></script>
    <script src="./js/common.js"></script>
    <script src="./js/editblog.js"></script>
  </body>
</html>
