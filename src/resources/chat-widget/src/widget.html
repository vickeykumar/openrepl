<!-- Genie panel. Layout and colours follow the "IDE states and menus" board
     of the redesign mockup: header, conversation, one-line composer. -->
<div id="chat-widget__header">
  <div id="chat-widget__title">
    <svg id="chat-widget__title_icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v4 M12 17v4 M3 12h4 M17 12h4 M6 6l2.5 2.5 M15.5 15.5L18 18 M6 18l2.5-2.5 M15.5 8.5L18 6"></path></svg>
    <!-- Widget title text is placed here -->
  </div>
  <span id="chat-widget__context"></span>
  <label class="chat-widget__peer" title="Peer chat: talk to the people in your shared session instead of Genie">
    <input type="checkbox" id="peerchat-switch">
    <span class="chat-widget__peer-label">Peer chat</span>
    <span class="chat-widget__peer-track" aria-hidden="true"></span>
  </label>
  <button type="button" id="chat-widget__close" aria-label="Close Genie" title="Close (Esc)">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"></path></svg>
  </button>
</div>
<div id="chat-widget__body">
  <!-- The messages_history div is placed here. -->
  <form id="chat-widget__form">
    <label for="chat-widget__input" class="chat-widget__sr-only">Ask Genie</label>
    <textarea
      autocomplete="off"
      id="chat-widget__input"
      name="message"
      rows="1"
      placeholder="Ask about your code"
      required></textarea>
    <button id="chat-widget__submit" type="submit" aria-label="Send">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14 M13 6l6 6-6 6"></path></svg>
    </button>
  </form>
</div>
