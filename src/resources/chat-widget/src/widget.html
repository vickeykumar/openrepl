<!-- Genie panel. Layout and colours follow the "IDE states and menus" board
     of the redesign mockup: header, conversation, one-line composer. -->
<div id="chat-widget__header">
  <div id="chat-widget__title">
    <svg id="chat-widget__title_icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 18a2 2 0 0 1 2 2a2 2 0 0 1 2 -2a2 2 0 0 1 -2 -2a2 2 0 0 1 -2 2m0 -12a2 2 0 0 1 2 2a2 2 0 0 1 2 -2a2 2 0 0 1 -2 -2a2 2 0 0 1 -2 2m-7 12a6 6 0 0 1 6 -6a6 6 0 0 1 -6 -6a6 6 0 0 1 -6 6a6 6 0 0 1 6 6"></path></svg>
    <!-- Widget title text is placed here -->
  </div>
  <span id="chat-widget__context"></span>
  <label class="chat-widget__peer" title="Peer chat: talk to the people in your shared session instead of Genie">
    <input type="checkbox" id="peerchat-switch">
    <span class="chat-widget__peer-label">Peer chat</span>
    <span class="chat-widget__peer-track" aria-hidden="true"></span>
  </label>
  <button type="button" id="chat-widget__close" aria-label="Close Genie" title="Close (Esc)">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"></path></svg>
  </button>
</div>
<div id="chat-widget__body">
  <!-- The messages_history div is placed here. -->
  <!-- The practice coach, on the practice page only (index.ts: wireCoach). -->
  <div id="chat-widget__coach" class="cw-coach" role="group" aria-label="Practice coach" hidden>
    <span id="chat-widget__coach-count" class="cw-coach__count"></span>
    <button type="button" data-coach="hint">Hint</button>
    <button type="button" data-coach="review">Review my solution</button>
    <button type="button" data-coach="complexity">Complexity</button>
  </div>
  <form id="chat-widget__form">
    <label for="chat-widget__input" class="chat-widget__sr-only">Ask Genie</label>
    <div id="chat-widget__field">
      <textarea
        autocomplete="off"
        id="chat-widget__input"
        name="message"
        rows="1"
        placeholder="Ask about your code"
        required></textarea>
      <div id="chat-widget__tools">
        <div id="chat-widget__mode" class="cw-mode" role="group" aria-label="Mode" hidden>
          <button type="button" data-mode="chat" aria-pressed="true">Chat</button>
          <button type="button" data-mode="agent" aria-pressed="false">Agent</button>
        </div>
        <button type="button" id="chat-widget__model-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="chat-widget__settings" title="Choose the model and how long it thinks">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10 M18 7h2 M4 17h2 M10 17h10 M14 5v4 M6 15v4"></path></svg>
          <span id="chat-widget__model-label"></span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="chat-widget__chev"><path d="M6 15l6-6 6 6"></path></svg>
        </button>
        <span id="chat-widget__tools-spacer"></span>
        <button id="chat-widget__submit" type="submit" aria-label="Send">
          <svg class="cw-submit__send" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14 M13 6l6 6-6 6"></path></svg>
          <svg class="cw-submit__stop" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2.5"></rect></svg>
        </button>
      </div>
    </div>
    <!-- What the visitor has left of Genie (index.ts: renderUsage). -->
    <div id="chat-widget__usage" class="cw-usage" hidden>
      <button type="button" id="chat-widget__usage-line" class="cw-usage__line" aria-expanded="false" aria-controls="chat-widget__usage-more" title="How much of Genie you have left">
        <span id="chat-widget__usage-text"></span>
        <span class="cw-usage__track" aria-hidden="true"><span id="chat-widget__usage-fill"></span></span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="cw-usage__chev"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <dl id="chat-widget__usage-more" class="cw-usage__more" hidden></dl>
    </div>
    <div id="chat-widget__settings" role="dialog" aria-label="Model and effort" hidden>
      <div class="cw-set__label" id="cw-model-label">Model</div>
      <div class="cw-set__group" id="chat-widget__models" role="radiogroup" aria-labelledby="cw-model-label"></div>
      <div class="cw-set__label cw-set__label--effort" id="cw-effort-label">Effort</div>
      <div class="cw-seg" id="chat-widget__efforts" role="group" aria-labelledby="cw-effort-label"></div>
      <p class="cw-set__note" id="chat-widget__effort-note"></p>
      <p class="cw-set__foot">Remembered on this device. Peer chat messages don't use either.</p>
    </div>
  </form>
</div>
