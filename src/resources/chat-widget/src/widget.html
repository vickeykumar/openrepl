<!-- Genie panel. Layout and colours follow the "IDE states and menus" board
     of the redesign mockup: header, conversation, one-line composer. -->
<div id="chat-widget__header">
  <div id="chat-widget__title">
    <svg class="genie-ico" id="chat-widget__title_icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="gi-lamp"><path d="M3 15h11c0 3-2.2 5-5.5 5S3 18 3 15z"></path><path d="M6.5 15c0-1.4.9-2.3 2-2.3s2 .9 2 2.3"></path><path d="M14 15.5c1.7 0 3-1.2 3.8-2.8"></path><path d="M3.2 16.3c-1.5.3-2-1.5-1-2.6"></path><path d="M8.5 20v1.5M6 21.5h5"></path></g><path class="gi-smoke" d="M18.4 13.3c2.4-.2 3.6-1.4 3.4-3.1"></path><path class="gi-spark" d="M17.6 .6l1.6 3.9 3.7 1.4-3.7 1.4-1.6 3.9-1.6-3.9-3.7-1.4 3.7-1.4z"></path><path class="gi-mini gi-m1" d="M11.2 3.2l.5 1.3 1.3.5-1.3.5-.5 1.3-.5-1.3-1.3-.5 1.3-.5z"></path><path class="gi-mini gi-m2" d="M22 9.9l.4 1.1 1.1.4-1.1.4-.4 1.1-.4-1.1-1.1-.4 1.1-.4z"></path><path class="gi-mini gi-m3" d="M9 7.2l.4 1 1 .4-1 .4-.4 1-.4-1-1-.4 1-.4z"></path><g class="gi-tick"><circle cx="4.6" cy="5" r="3.6" fill="#2E9E5B" stroke="none"></circle><path d="M3 5l1.2 1.2 2.2-2.4" stroke="#FFFFFF" stroke-width="1.4"></path></g></svg>
    <!-- Widget title text is placed here -->
  </div>
  <span id="chat-widget__context"></span>
  <label class="chat-widget__peer" data-tip-name="Peer chat" data-tip-desc="Talk to the people in your shared session instead of Genie." title="Peer chat: talk to the people in your shared session instead of Genie">
    <input type="checkbox" id="peerchat-switch">
    <span class="chat-widget__peer-label">Peer chat</span>
    <span class="chat-widget__peer-track" aria-hidden="true"></span>
  </label>
  <button type="button" id="chat-widget__pin" aria-pressed="false" aria-label="Pin Genie beside the IDE" title="Pin Genie beside the IDE" hidden>
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4.5l-4 4l-4 1.5l-1.5 1.5l7 7l1.5 -1.5l1.5 -4l4 -4"></path><path d="M9 15l-4.5 4.5"></path><path d="M14.5 4l5.5 5.5"></path></svg>
  </button>
  <button type="button" id="chat-widget__close" data-tip-name="Close" data-tip-keys="Esc" data-tip-desc="Hide Genie. A task or an answer carries on." aria-label="Close Genie" title="Close (Esc)">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"></path></svg>
  </button>
</div>
<div id="chat-widget__body">
  <!-- The messages_history div is placed here. -->
  <!-- The practice coach, on the practice page only (index.ts: wireCoach). -->
  <div id="chat-widget__coach" class="cw-coach" role="group" aria-label="Practice coach" hidden>
    <span id="chat-widget__coach-count" class="cw-coach__count"></span>
    <button type="button" data-coach="hint">Hint</button>
    <button type="button" data-coach="review">Review my solution</button>
    <button type="button" data-coach="complexity">Complexity</button>
  </div>
  <form id="chat-widget__form">
    <label for="chat-widget__input" class="chat-widget__sr-only">Ask Genie</label>
    <div id="chat-widget__field">
      <div id="chat-widget__attached" role="group" aria-label="Added to this message" hidden></div>
      <textarea
        autocomplete="off"
        aria-autocomplete="list"
        aria-controls="chat-widget__picker"
        id="chat-widget__input"
        name="message"
        rows="1"
        placeholder="Ask about your code"
        required></textarea>
      <div id="chat-widget__tools">
        <div id="chat-widget__mode" class="cw-mode" role="group" aria-label="Mode" hidden>
          <button type="button" data-mode="chat" data-tip-desc="Genie answers your questions." aria-pressed="true">Chat</button>
          <button type="button" data-mode="agent" aria-pressed="false">Agent</button>
        </div>
        <button type="button" id="chat-widget__model-btn" data-tip-name="Model and effort" aria-haspopup="dialog" aria-expanded="false" aria-controls="chat-widget__settings" title="Choose the model and how long it thinks">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10 M18 7h2 M4 17h2 M10 17h10 M14 5v4 M6 15v4"></path></svg>
          <span id="chat-widget__model-label"></span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="chat-widget__chev"><path d="M6 15l6-6 6 6"></path></svg>
        </button>
        <span id="chat-widget__tools-spacer"></span>
        <button id="chat-widget__submit" type="submit" aria-label="Send" data-tip-name="Send">
          <svg class="cw-submit__send" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14 M13 6l6 6-6 6"></path></svg>
          <svg class="cw-submit__stop" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2.5"></rect></svg>
        </button>
      </div>
    </div>
    <!-- What the visitor has left of Genie (index.ts: renderUsage). -->
    <div id="chat-widget__usage" class="cw-usage" hidden>
      <button type="button" id="chat-widget__usage-line" data-tip-name="Usage" class="cw-usage__line" aria-expanded="false" aria-controls="chat-widget__usage-more" title="How much of Genie you have left">
        <span id="chat-widget__usage-text"></span>
        <span class="cw-usage__track" aria-hidden="true"><span id="chat-widget__usage-fill"></span></span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="cw-usage__chev"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <dl id="chat-widget__usage-more" class="cw-usage__more" hidden></dl>
    </div>
    <div id="chat-widget__picker" class="cw-picker" role="listbox" aria-label="Files and folders" hidden></div>
    <div id="chat-widget__settings" role="dialog" aria-label="Model and effort" hidden>
      <label class="cw-search" for="chat-widget__model-search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input type="text" id="chat-widget__model-search" placeholder="Search models" autocomplete="off" spellcheck="false" aria-label="Search models">
        <button type="button" id="chat-widget__model-clear" class="cw-search__clear" aria-label="Clear search" hidden>&times;</button>
      </label>
      <div class="cw-set__count" id="chat-widget__model-count" role="status" hidden></div>
      <div class="cw-set__scroll">
      <div class="cw-set__label" id="cw-model-label">Your models</div>
      <div class="cw-set__group" id="chat-widget__models" role="radiogroup" aria-labelledby="cw-model-label"></div>
      <div class="cw-set__group" id="chat-widget__results" role="radiogroup" aria-label="Matching models" hidden></div>
      <button type="button" id="chat-widget__others-toggle" class="cw-others" aria-expanded="false" aria-controls="chat-widget__others">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="cw-others__chev"><path d="M9 6l6 6-6 6"></path></svg>
        <span class="cw-others__name">Other models</span>
        <span class="cw-others__count" id="chat-widget__others-count"></span>
      </button>
      <div class="cw-others__list" id="chat-widget__others" hidden></div>
      </div>
      <div class="cw-set__label cw-set__label--effort" id="cw-effort-label">Effort</div>
      <div class="cw-seg" id="chat-widget__efforts" role="group" aria-labelledby="cw-effort-label"></div>
      <p class="cw-set__note" id="chat-widget__effort-note"></p>
      <p class="cw-set__foot">Remembered on this device. Peer chat messages don't use either.</p>
    </div>
  </form>
</div>
